# fly.toml app configuration file generated for loopstream on 2026-07-27T19:34:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "loopstream"
primary_region = "iad"   # put this near your Restream ingest region

# No [http_service] / [[services]]: pure outbound worker. No public IP, no
# health-check machinery, no $2/mo IPv4, nothing to auto-stop.

swap_size_mb = 256

[env]
  VIDEO_URL     = "https://huggingface.co/buckets/misukisu/imm/resolve/copy_AFEE0C40-CF77-4571-8AEE-DD637BA33699.mov"
  RTMP_URL      = "rtmp://live.restream.io/live"
  MAX_HOURS     = "60"
  STALL_TIMEOUT = "45"
  REFRESH       = "0"     # 1 = re-fetch the URL between sessions
  VB            = "1800k" # only used if the source needs transcoding

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  processes = ['app']

[[restart]]
  policy = "always"
  retries = 0

# Optional: persist the normalized loop across restarts so a machine reboot
# doesn't re-download and re-encode. ~$0.15/mo for 1 GB.
# [[mounts]]
#   source = "loopcache"
#   destination = "/var/cache/loopstream"
