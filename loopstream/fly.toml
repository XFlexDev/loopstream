app = "loopstream"
primary_region = "iad"   # put this near your Restream ingest region

# No [http_service] and no [[services]] on purpose: this is a pure outbound
# worker. Skipping them means no public IP (and no $2/mo IPv4 charge), no
# health-check machinery, and no auto-stop behaviour to fight with.

swap_size_mb = 256       # cheap insurance; should never actually be touched

[env]
  VIDEO         = "/app/loop.mp4"
  RTMP_URL      = "rtmp://live.restream.io/live"
  MAX_HOURS     = "6"
  STALL_TIMEOUT = "45"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"        # 256mb also works and halves the machine cost

[[restart]]
  policy = "always"
  retries = 0
