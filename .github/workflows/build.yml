name: Flatten loopstream

on:
  workflow_dispatch:          # run manually from the Actions tab
  push:
    paths:
      - 'loopstream/**'       # auto‑run when something inside loopstream changes

permissions:
  contents: write

concurrency:
  group: flatten-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if loopstream exists
        id: check
        run: |
          if [ -d "loopstream" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No loopstream folder found – nothing to do."
          fi

      - name: Move contents to root
        if: steps.check.outputs.exists == 'true'
        run: |
          set -euo pipefail
          # Copy everything from loopstream/ to the root, overwriting any conflicts
          rsync -a loopstream/ ./
          # Remove the now‑empty folder
          rm -rf loopstream

      - name: Commit and push
        if: steps.check.outputs.exists == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Flatten loopstream into repo root [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
